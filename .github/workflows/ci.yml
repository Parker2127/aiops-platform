name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no floating major tag upstream
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check ml apps
          uv run ruff format --check ml apps
      - name: pytest (all apps + ml; gRPC stubs generated by conftest)
        run: uv run pytest

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.17"
      - run: terraform fmt -check -recursive infra
      - name: validate
        run: |
          for dir in infra/bootstrap infra/envs/dev; do
            echo "== ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
          done

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kustomize build every app
        run: |
          for dir in apps/*/k8s; do
            echo "== ${dir}"
            kubectl kustomize "${dir}" > /dev/null
          done
      - name: shellcheck
        run: shellcheck scripts/*.sh
