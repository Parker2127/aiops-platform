apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.21.0
    helm:
      valuesObject:
        resources:
          operator:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          metricServer:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          webhooks:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        prometheus:
          operator:
            enabled: true
            serviceMonitor: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
