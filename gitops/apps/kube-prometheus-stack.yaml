apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.3.0
    helm:
      valuesObject:
        # EKS manages these control-plane components; their endpoints are not scrapeable.
        kubeEtcd: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeProxy: { enabled: false }

        prometheus:
          prometheusSpec:
            retention: 2d
            # No PVC: emptyDir keeps teardown clean (no orphaned EBS volumes).
            # Pick up ServiceMonitors from every namespace, not just this release.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            scrapeInterval: 15s
            resources:
              requests: { cpu: 100m, memory: 512Mi }
              limits: { memory: 1536Mi }

        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }

        grafana:
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL

        prometheusOperator:
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }

        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 192Mi }

        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false # platform component: never auto-delete on a bad commit
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The operator CRDs exceed the 256KB client-side apply annotation limit.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
