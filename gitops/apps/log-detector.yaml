apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: log-detector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Parker2127/aiops-platform.git
    targetRevision: main
    path: apps/log-detector/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: log-detector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
