apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finops-optimizer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Parker2127/aiops-platform.git
    targetRevision: main
    path: apps/finops-optimizer/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: finops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
