# Predictive autoscaling: KEDA asks our external scaler for a metric, and the
# scaler answers with max(current rps, forecast rps at t+horizon). KEDA creates
# and owns the HPA (replaces the Phase 3 CPU placeholder).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: demo-app
spec:
  scaleTargetRef:
    name: demo-app
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - { type: Pods, value: 4, periodSeconds: 15 }
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - { type: Pods, value: 1, periodSeconds: 30 }
  triggers:
    - type: external
      metricType: AverageValue # replicas = ceil(metric / targetRps)
      metadata:
        scalerAddress: keda-scaler.keda-scaler.svc.cluster.local:4350
        query: sum(rate(http_requests_total{namespace="demo",path="/work"}[1m]))
        targetRps: "50"
        horizon: "120"
        window: "300"
