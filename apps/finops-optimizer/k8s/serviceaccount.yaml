apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-optimizer
  namespace: finops
  annotations:
    # IRSA role from infra/envs/dev/finops.tf: Cost Explorer, EC2 read (+ DeleteVolume), S3 reports, Bedrock
    eks.amazonaws.com/role-arn: arn:aws:iam::818651034041:role/aiops-dev-finops-optimizer
---
# Cluster-wide read of pod specs for the "containers without requests" scan.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: finops-optimizer-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: finops-optimizer-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: finops-optimizer-pod-reader
subjects:
  - kind: ServiceAccount
    name: finops-optimizer
    namespace: finops
