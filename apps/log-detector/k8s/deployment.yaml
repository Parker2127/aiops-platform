apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-detector
  namespace: log-detector
  labels: { app: log-detector }
spec:
  replicas: 1 # in-memory dedup state; scale-out would need a shared store
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: log-detector }
  template:
    metadata:
      labels: { app: log-detector }
    spec:
      serviceAccountName: log-detector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: log-detector
          image: log-detector
          envFrom:
            - configMapRef: { name: log-detector-config }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp } # model download lands here
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
