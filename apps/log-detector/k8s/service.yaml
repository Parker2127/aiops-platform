apiVersion: v1
kind: Service
metadata:
  name: log-detector
  namespace: log-detector
  labels: { app: log-detector }
spec:
  selector: { app: log-detector }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: log-detector
  namespace: log-detector
  labels: { app: log-detector }
spec:
  selector:
    matchLabels: { app: log-detector }
  endpoints:
    - { port: http, path: /metrics/, interval: 15s }
