# Read-only access to the demo namespace's pod logs (MODE=k8s).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-detector-reader
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-detector-reader
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-detector-reader
subjects:
  - kind: ServiceAccount
    name: log-detector
    namespace: log-detector
